<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de pacientes - AXIS MEDICAL CENTER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="interna">
    <header class="topo">
        <a href="painel.html" class="marca">
            <img src="../imagens/logo/Interlocking Navy and Teal Medical Cross.png" alt="">
            <span>AXIS MEDICAL CENTER</span>
        </a>

        <nav aria-label="Navegação principal">
            <a href="painel.html">Painel</a>
            <a href="cadastro-pacientes.html" class="ativo" aria-current="page">Cadastro</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="triagem.html">Triagem</a>
            <a href="fila.html">Fila</a>
            <a href="agendamento.html">Agendamento</a>
            <a href="prontuarios.html">Prontuário</a>
            <a href="medicos.html">Médicos</a>
            <a href="leitos.html">Leitos</a>
            <a href="usuarios.html">Usuários</a>
        </nav>
    </header>

    <main class="conteudo">
        <section class="bloco-compacto" aria-labelledby="titulo-cadastro">
            <h1 id="titulo-cadastro">Cadastro de paciente</h1>
            <p>Preencha os dados abaixo para adicionar um paciente à lista.</p>

            <form id="form-paciente">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" autocomplete="name" required
                    placeholder="Digite o nome completo do paciente">

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" inputmode="numeric" autocomplete="off"
                    placeholder="000.000.000-00" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" autocomplete="tel" placeholder="(83) 90000-0000">

                <button type="submit" class="botao">Salvar paciente</button>
                <a href="pacientes.html">Cancelar</a>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>Sistema do Hospital Municipal - projeto de desenvolvimento front-end</p>
    </footer>

    <script src="../js/app.js"></script>
</body>

</html>
