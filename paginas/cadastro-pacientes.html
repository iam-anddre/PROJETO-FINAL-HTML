<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pacientes - AXIS MEDICAL CENTER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;display=swap">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="interna">

    <header class="topo">
        <a href="painel.html" class="marca">
            <img src="../imagens/logo/Interlocking Navy and Teal Medical Cross.png" alt="">
            <span>AXIS MEDICAL CENTER</span>
        </a>
        <nav>
            <a href="painel.html">Painel</a>
            <a href="cadastro-pacientes.html" class="ativo">Cadastro</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="triagem.html">Triagem</a>
            <a href="fila.html">Fila</a>
            <a href="agendamento.html">Agendamento</a>
            <a href="prontuario.html">Prontuário</a>
            <a href="medicos.html">Médicos</a>
            <a href="leitos.html">Leitos</a>
            <a href="usuarios.html">Usuários</a>
        </nav>
        <a href="../index.html" class="botao">Sair</a>
    </header>

    <main class="conteudo">
        <section class="bloco-compacto">
            <h2>Dados do paciente</h2>
            <form id="form-paciente">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite o nome completo do paciente">

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(83) 90000-0000">

                <button type="submit">Salvar paciente</button>
                <a href="pacientes.html">Cancelar</a>
            </form>
        </section>
    </main>



    <footer class="rodape">
        <p>Sistema do Hospital Municipal - projeto escolar</p>
    </footer>

    <script src="../js/app.js"></script>


</body>

</html>
