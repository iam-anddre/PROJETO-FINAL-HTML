<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nome da Hamburgueria</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <h1>Nome da Hamburgueria</h1>
  </header>

  <main>
    <!-- TELA 1: CARDÁPIO (uma página longa, rolagem contínua) -->
    <section id="tela-cardapio" class="tela">
      <div class="hero" id="hero"></div>
      <nav class="categorias" id="categorias"></nav>
      <div id="lista-produtos"></div>
    </section>

    <!-- TELA 2: CARRINHO -->
    <section id="tela-carrinho" class="tela hidden">
      <h2>Carrinho</h2>
      <div id="itens-carrinho"></div>
      <p class="total">Total: <strong id="total-carrinho">R$ 0,00</strong></p>
      <button data-acao="finalizar">Finalizar pedido</button>
    </section>

    <!-- TELA 3: PEDIDOS -->
    <section id="tela-pedidos" class="tela hidden">
      <h2>Pedidos</h2>
      <div id="lista-pedidos"></div>
    </section>

    <!-- TELA 4: PERFIL -->
    <section id="tela-perfil" class="tela hidden">
      <h2>Perfil</h2>
      <p>Em construção.</p>
    </section>
  </main>

  <!-- BARRA DE BAIXO -->
  <nav class="abas">
    <button data-tela="cardapio" class="ativa">Cardápio</button>
    <button data-tela="carrinho">Carrinho <span id="badge" class="badge hidden">0</span></button>
    <button data-tela="pedidos">Pedidos</button>
    <button data-tela="perfil">Perfil</button>
  </nav>

  <script src="js/produtos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
